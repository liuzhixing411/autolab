[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolab"
version = "0.6.5"
description = "Autonomous research loop: PI / student / reviewer agents on ARIS + K-Dense skills, with field packs"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
autolab = "autolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
